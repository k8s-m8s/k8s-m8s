# Keeps the commit-pinned actions in .github/workflows and the Python
# requirements up to date.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # requirements.txt and requirements-site.txt. A pull request is opened only
  # when a new release falls outside the allowed range (for example Zensical 0.2).
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase-if-necessary
