name: Weekly bookkeeping

# Every Monday: refresh `verified` (and `source_commit` where upstream edited a
# file without changing the claim) on every entry that still matches upstream,
# and open one pull request with only those changes. Claim changes and
# problems are left to detect.yml. automerge.yml merges the pull request after
# check_diff.py's bookkeeping check passes. See docs/maintainers/automation.md.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.verify.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements.lock

      - name: Refresh entries that still match upstream
        id: verify
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          python scripts/verify.py --write --report-json "$RUNNER_TEMP/out/report.json"
          python scripts/validate.py --strict
          python scripts/check_diff.py bookkeeping HEAD WORKTREE || true
          cp -R data "$RUNNER_TEMP/out/data"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/out/base"
          if git diff --quiet -- data; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - if: steps.verify.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bookkeeping
          path: ${{ runner.temp }}/out
          retention-days: 7

  publish:
    needs: verify
    if: needs.verify.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bookkeeping
          path: ${{ runner.temp }}/out

      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Open or update the bookkeeping pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUTOMATION_LOGIN: ${{ vars.AUTOMATION_LOGIN }}
        run: >-
          python scripts/publish_findings.py bookkeeping
          --report "$RUNNER_TEMP/out/report.json"
          --data-dir "$RUNNER_TEMP/out"
          --base "$(cat "$RUNNER_TEMP/out/base")"
