name: Detect upstream changes

# Daily: re-read every upstream statement, once. The detect job has no
# secrets and a read-only token; from that one reading it writes the report
# and two sets of data files to an artifact: the claim changes
# (verify.py --claims-only) and the bookkeeping refresh of entries that still
# match (--bookkeeping-out, what --write would write). The publish job runs
# only if something needs publishing (or an open pull request or issue may
# need closing). It commits nothing from a pull request
# and mints the automation App's token in the step that uses it, once for the
# claim changes and once for the bookkeeping pull request, so a failure in one
# does not stop the other. See docs/maintainers/automation.md.

on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:
    inputs:
      fixture:
        description: "Test only: instead of reading upstream, open a claim PR for this tool with a deliberate mistake"
        type: string
        default: ""
      fixture_kind:
        description: "Test only: the mistake, a claim upstream does not state or a removal upstream did not make"
        type: choice
        options: [claim, removal]
        default: claim

permissions: {}

concurrency:
  group: detect
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      publish: ${{ steps.pending.outputs.publish }}
      bookkeeping: ${{ steps.bookkeeping.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements.lock

      - name: Compare with upstream and write claim changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FIXTURE: ${{ inputs.fixture }}
          FIXTURE_KIND: ${{ inputs.fixture_kind }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp -R data "$RUNNER_TEMP/main-data"
          if [ -n "$FIXTURE" ]; then
            python scripts/test_fixture.py --tool "$FIXTURE" --kind "${FIXTURE_KIND:-claim}" --report-json "$RUNNER_TEMP/out/report.json"
          else
            python scripts/verify.py --claims-only --bookkeeping-out "$RUNNER_TEMP/out/bookkeeping" --report-json "$RUNNER_TEMP/out/report.json"
          fi
          cp -R data "$RUNNER_TEMP/out/data"
          echo "$GITHUB_SHA" > "$RUNNER_TEMP/out/base"

      - name: Check whether anything needs publishing
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "publish=$(python scripts/publish_findings.py pending --report "$RUNNER_TEMP/out/report.json")" >> "$GITHUB_OUTPUT"

      # Not on fixture runs. A failure here leaves the day's dates unrefreshed
      # (the site then shows the older date) but never stops the claim changes.
      - name: Check whether the bookkeeping refresh changed anything
        id: bookkeeping
        if: ${{ !inputs.fixture }}
        continue-on-error: true
        run: |
          status=0
          diff -rq "$RUNNER_TEMP/main-data" "$RUNNER_TEMP/out/bookkeeping/data" > /dev/null || status=$?
          case "$status" in
            0) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            1) echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::no bookkeeping output to compare"; echo "changed=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - if: steps.pending.outputs.publish == 'true' || steps.bookkeeping.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: findings
          path: ${{ runner.temp }}/out
          retention-days: 7

  publish:
    needs: detect
    if: needs.detect.outputs.publish == 'true' || needs.detect.outputs.bookkeeping == 'true'
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --require-hashes -r requirements.lock
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: findings
          path: ${{ runner.temp }}/out

      - id: app
        if: needs.detect.outputs.publish == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Open or update pull requests and issues
        if: needs.detect.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          AUTOMATION_LOGIN: ${{ vars.AUTOMATION_LOGIN }}
        run: >-
          python scripts/publish_findings.py detect
          --report "$RUNNER_TEMP/out/report.json"
          --data-dir "$RUNNER_TEMP/out"
          --base "$(cat "$RUNNER_TEMP/out/base")"

      - id: bookkeeping_app
        if: ${{ !cancelled() && needs.detect.outputs.bookkeeping == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Open or update the bookkeeping pull request
        if: ${{ !cancelled() && needs.detect.outputs.bookkeeping == 'true' }}
        env:
          GH_TOKEN: ${{ steps.bookkeeping_app.outputs.token }}
          AUTOMATION_LOGIN: ${{ vars.AUTOMATION_LOGIN }}
        run: >-
          python scripts/publish_findings.py bookkeeping
          --report "$RUNNER_TEMP/out/report.json"
          --data-dir "$RUNNER_TEMP/out/bookkeeping"
          --base "$(cat "$RUNNER_TEMP/out/base")"
