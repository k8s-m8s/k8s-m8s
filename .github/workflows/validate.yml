name: Validate data

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# No secrets and a read-only token: this is the only workflow that runs pull
# request code, so it must never be given an environment or write access.
permissions: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt -r requirements-site.txt
      - run: python scripts/validate.py --strict
      - run: python -m unittest discover tests
      - run: python scripts/generate.py
      - name: Check the generated navigation is committed
        run: git diff --exit-code zensical.toml
      - run: zensical build
