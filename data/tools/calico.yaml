name: calico
title: Calico
category: networking
repo: https://github.com/projectcalico/calico
# The statement lives in the documentation repository of Tigera, the company
# that maintains Calico (the source of docs.tigera.io, which the main repo's
# README links to). Only the Calico Open Source pages are read.
official_sources:
  - https://github.com/tigera/docs
upstream_license: Apache-2.0
notes: >-
  The system requirements page for each Calico version lists the Kubernetes
  minor versions that version is tested against, without patch versions, and
  for some versions an old Kubernetes version at or below which it will not
  work. Only the versions the documentation repository still carries are
  recorded. The recorded commit is from the documentation repository.
releases:
  - version: "3.33"
    tested: ["1.35", "1.36", "1.37"]
    source: https://github.com/tigera/docs/blob/main/calico_versioned_docs/version-3.33/_includes/partials/_system-requirements.mdx
    source_commit: 478cfc6ea26dfc3ae90ff3b23d7d53772718bc75
    verified: 2026-11-23
  - version: "3.32"
    tested: ["1.34", "1.35", "1.36"]
    unsupported:
      - max: "1.20"
    source: https://github.com/tigera/docs/blob/main/calico_versioned_docs/version-3.32/_includes/partials/_system-requirements.mdx
    source_commit: 9b8e206648cca1097b440811d945ba8f7ce12382
    verified: 2026-11-23
  - version: "3.31"
    tested: ["1.32", "1.33", "1.34", "1.35"]
    unsupported:
      - max: "1.20"
    source: https://github.com/tigera/docs/blob/main/calico_versioned_docs/version-3.31/_includes/partials/_system-requirements.mdx
    source_commit: 9b8e206648cca1097b440811d945ba8f7ce12382
    verified: 2026-11-23
