category: gitops-delivery
repo: https://github.com/fluxcd/flux2
upstream_license: Apache-2.0
notes: >-
  The release notes of each Flux minor release list the Kubernetes minor
  versions the release is compatible with. Upstream also gives a minimum
  patch version for each minor, which is not recorded here; see the source.
  It does not say which versions were tested. The recorded commit is the commit
  the release tag points to.
