upstream_license: Apache-2.0
notes: >-
  Transposed data. Upstream's compatibility matrix is keyed by Kubernetes
  minor and gives the minimum Karpenter version for each (for example 1.36
  needs 1.13 or later). The version bands here are derived from those
  minimums and stop at the highest Karpenter version the table names. Only
  the compatible combinations are recorded; combinations the table does not
  list are unknown, not unsupported. The statement is from the AWS provider
  repository and concerns Karpenter on AWS. It does not say which versions
  were tested.
