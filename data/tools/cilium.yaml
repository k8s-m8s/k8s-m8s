notes: >-
  The Kubernetes compatibility page on each release branch lists the
  Kubernetes minor versions that are e2e tested for that Cilium version.
  Upstream names minors only, not patch versions, and makes no claim about
  versions it does not list. Each entry here is read from its own release
  branch.
