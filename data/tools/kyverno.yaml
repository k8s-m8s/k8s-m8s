name: kyverno
title: Kyverno
category: observability-policy-scaling
repo: https://github.com/kyverno/kyverno
# The statement lives in the project's website repository (the source of
# kyverno.io, which the main repo's README links to).
official_sources:
  - https://github.com/kyverno/website
upstream_license: Apache-2.0
notes: >-
  The releases page states a supported Kubernetes range for the one currently
  supported Kyverno release only. It does not say which versions were tested.
  Earlier releases were read from the page's git history: each from the last
  commit that still named it, and its delisted date is the date of the commit
  that replaced it. 1.19's range was widened to 1.36 before it was replaced;
  the last value is recorded. Revisions before 2026-04-15, including the
  page's earlier paths, contain no such statement. The recorded commits are
  from the website repository.
releases:
  - version: "1.20"
    stated:
      min: "1.34"
      max: "1.37"
      wording: Kubernetes Versions Supported
    source: https://github.com/kyverno/website/blob/main/src/content/docs/docs/installation/releases.md
    source_commit: 241122ad901e9e7ff8f14136d7969677c7915073
