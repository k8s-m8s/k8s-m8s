category: backup-storage
repo: https://github.com/longhorn/longhorn
# The statement lives in the project's website repository (the source of
# longhorn.io, which the main repo's README links to).
official_sources:
  - https://github.com/longhorn/website
upstream_license: Apache-2.0
notes: >-
  The best practices page of each Longhorn patch release's documentation
  lists Kubernetes minor versions that have been tested with that release.
  Upstream names minors only. Entries are per patch release because the list
  differs between patches. Only released versions are recorded; documentation
  for 1.5 and older carries no such list. The recorded commit is from the website
  repository.
