notes: >-
  The README's technical specifications table gives a minimum Kubernetes
  version, open-ended ("1.32+"), for one release per minor version. Upstream
  shows only the latest patch release of each minor, so the claim is recorded
  for that patch release only; when a newer patch replaces it, the earlier row
  is kept as no longer listed. The table's Edge row (the unreleased main
  branch) and the OpenShift table are not recorded.
