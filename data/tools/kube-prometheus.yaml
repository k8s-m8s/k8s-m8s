notes: >-
  The README's compatibility grid marks, for each release branch, the
  Kubernetes minors that are "supported and work as we test against these
  versions in their respective branches". Upstream also notes that CI tests
  only the last two releases and the main branch regularly, so the ticks are
  recorded as stated rather than tested. Cells marked x are not recorded,
  because upstream does not say those versions do not work. The main branch
  is not a release and is not recorded.
