# The statement lives in the project's release repository, which the main
# repo's Kubernetes compatibility document links to.
official_sources:
  - https://github.com/kubevirt/sig-release
upstream_license: Apache-2.0
notes: >-
  The support matrix in the sig-release repository marks, for each KubeVirt
  minor release, the Kubernetes minors it supports. Upstream marks some cells
  EOL and defines that as a Kubernetes version KubeVirt supported that has
  since reached its end of life; those are recorded as stated like the others.
  The matrix covers only recent KubeVirt releases.
