name: helm
title: Helm
category: gitops-delivery
repo: https://github.com/helm/helm
# The statement lives in the project's website repository (the source of
# helm.sh, which the main repo's README links to).
official_sources:
  - https://github.com/helm/helm-www
upstream_license: Apache-2.0
notes: >-
  The version support policy page gives, for each Helm minor release, a range
  of supported Kubernetes minors. Helm 4 is listed on the current page and Helm
  3 and 2 on the version 3 page; both are in the website repository. Upstream
  states no testing claim. The page also describes a general rule for how far
  Helm's support reaches; only the table rows are recorded.
