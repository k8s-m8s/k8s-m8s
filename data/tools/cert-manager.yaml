category: security
repo: https://github.com/cert-manager/cert-manager
# The statement lives in the project's website repository (the source of
# cert-manager.io, which the main repo's README links to).
official_sources:
  - https://github.com/cert-manager/website
upstream_license: Apache-2.0
notes: >-
  The supported releases page gives, for each currently supported
  cert-manager release, a supported Kubernetes range and a separate tested
  range, both as minors without patch versions. Older releases have a single
  compatible range and no testing claim. The recorded commit is from the website
  repository.
