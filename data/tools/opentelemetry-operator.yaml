name: opentelemetry-operator
title: OpenTelemetry Operator
category: observability-policy-scaling
repo: https://github.com/open-telemetry/opentelemetry-operator
upstream_license: Apache-2.0
notes: >-
  The compatibility page's matrix gives a supported Kubernetes range for each
  operator release, recorded under the release exactly as upstream names it.
  Upstream lists only recent releases; older rows it removes are kept as no
  longer listed. A release the matrix marks N/A has no claim and is not
  recorded, nor are the cert-manager and Prometheus Operator columns.
